<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ÖzSinyal</title><meta property="og:title" content="ÖzSinyal · Sürücü kursu otomasyonu"><meta property="og:description" content="Öğrenci kaydı, direksiyon planı, ödeme, sınav ve MEB işleri tek yerde."><meta property="og:image" content="https://servetskr.github.io/sinyal/img/site/paylas-102.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(60% 40% at 50% 100%,rgba(255,170,70,.14),transparent 70%),#070b14;color:rgba(214,222,238,.75);font:17px/1.55 system-ui,-apple-system,sans-serif}main{max-width:420px;padding:28px;text-align:center}main svg{width:56px;height:56px;margin-bottom:18px}b{display:block;font-size:22px;color:#fff;margin-bottom:6px}a.git{display:inline-flex;align-items:center;margin-top:22px;min-height:48px;padding:0 22px;border-radius:12px;background:#ffc21a;color:#0b1220;font-weight:800;text-decoration:none}a.git[hidden]{display:none}.oz{font-weight:400;opacity:.55}</style></head>
<body><main><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 0C55 0 64 9 64 32S55 64 32 64 0 55 0 32 9 0 32 0Z" fill="#ffc21a"/><path d="M56.6 7.4C51.5 2.3 43.5 0 32 0 9 0 0 9 0 32c0 11.5 2.3 19.5 7.4 24.6z" fill="#131d31"/><path d="M56.6 7.4 7.4 56.6" stroke="#fff" stroke-opacity=".14"/><path class="rz-c" d="M32 0C55 0 64 9 64 32S55 64 32 64 0 55 0 32 9 0 32 0Z" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1.2"/><circle cx="15.5" cy="19.5" r="4.5" fill="#fff"/><circle cx="27.5" cy="19.5" r="4.5" fill="#fff"/><path d="M35 38l8 8-8 8" fill="none" stroke="#0b1220" stroke-opacity=".34" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M45 38l8 8-8 8" fill="none" stroke="#0b1220" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/></svg><b><span class="oz">Öz</span>Sinyal</b><p id="m">Link açılıyor…</p><a class="git" id="git" href="/sinyal/" hidden>Ana sayfaya dön</a></main>
<script>
(async () => {
  // site alan adının kökünde (/) ya da GitHub Pages altında (/sinyal/) çalışabilir
  const KOK = /^\/sinyal(\/|$)/.test(location.pathname) ? '/sinyal/' : '/';
  document.getElementById('git').href = KOK;
  const yol = location.pathname.slice(KOK.length).replace(/\/+$/, '');
  const m = document.getElementById('m');
  if (!yol || !/^[a-z0-9-]{4,90}$/.test(yol)) { m.textContent = 'Aradığınız sayfa bulunamadı.'; document.getElementById('git').hidden = false; return; }
  try {
    const j = await (await fetch('https://sinyal-wa.sinemsavar0.workers.dev/k/' + yol)).json();
    if (j.ok && j.hedef) { location.replace(j.hedef); return; }
  } catch (e) { }
  m.textContent = 'Bu linkin süresi dolmuş ya da link hatalı. Kursa yazıp yeni link isteyin.'; document.getElementById('git').hidden = false;
})();
</script></body></html>
