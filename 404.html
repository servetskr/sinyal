<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sinyal Sürücü Kursu</title><meta property="og:title" content="Sinyal · Sürücü kursu otomasyonu"><meta property="og:description" content="Öğrenci kaydı, direksiyon planı, ödeme, sınav ve MEB işleri tek yerde."><meta property="og:image" content="https://servetskr.github.io/sinyal/img/site/paylas-101.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f0ea;color:#1c2129;font:17px/1.5 system-ui,-apple-system,sans-serif}main{max-width:420px;padding:28px;text-align:center}b{display:block;font-size:20px;margin-bottom:6px}</style></head>
<body><main><b>Sinyal Sürücü Kursu</b><p id="m">Link açılıyor…</p></main>
<script>
(async () => {
  const yol = location.pathname.replace(/^\/sinyal\/?/, '').replace(/\/+$/, '');
  const m = document.getElementById('m');
  if (!yol || !/^[a-z0-9-]{4,90}$/.test(yol)) { m.textContent = 'Sayfa bulunamadı.'; return; }
  try {
    const j = await (await fetch('https://sinyal-wa.sinemsavar0.workers.dev/k/' + yol)).json();
    if (j.ok && j.hedef) { location.replace(j.hedef); return; }
  } catch (e) { }
  m.textContent = 'Bu linkin süresi dolmuş ya da link hatalı. Kursa yazıp yeni link isteyin.';
})();
</script></body></html>
