<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Öğrenci olarak aç</title>
<script type="module">
const v = (await (await fetch('/index.html', { cache: 'no-store' })).text()).match(/baslat\.js\?v=(\d+)/)[1];
const V = await import(`/js/veri.js?v=${v}`);
const og = V.S.kursiyerler.find(k => k.asama === 'Direksiyon') || V.S.kursiyerler[0];
sessionStorage.setItem('sinyal-oturum', JSON.stringify({ id: 'ogr-' + og.id, ad: 'Öğrenci', rol: 'ogrenci', kursiyer: og.id }));
sessionStorage.setItem('sinyal-og-sekme', new URLSearchParams(location.search).get('s') || 'sinav');
location.replace('/');
</script>
