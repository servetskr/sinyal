<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Öğren prototipi</title>
<style>
@font-face{font-family:Overpass;src:url(../fonts/overpass-latin-ext.woff2) format("woff2");font-weight:100 900;unicode-range:U+0100-024F,U+1E00-1EFF}
@font-face{font-family:Overpass;src:url(../fonts/overpass-latin.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Atkinson;src:url(../fonts/atkinson-hyperlegible-latin-ext.woff2) format("woff2");font-weight:400;unicode-range:U+0100-024F}
@font-face{font-family:Atkinson;src:url(../fonts/atkinson-hyperlegible-latin.woff2) format("woff2");font-weight:400}
@font-face{font-family:Atkinson;src:url(../fonts/atkinson-hyperlegible-700-latin-ext.woff2) format("woff2");font-weight:700;unicode-range:U+0100-024F}
@font-face{font-family:Atkinson;src:url(../fonts/atkinson-hyperlegible-700-latin.woff2) format("woff2");font-weight:700}
:root{
  --gece:#0b1830; --gece-2:#13284d; --asfalt:#30353d; --asfalt-2:#3b414a;
  --sari:#ffc21a; --sari-koyu:#7a5600; --mavi:#0a4da2; --yesil-levha:#0b6b48;
  --zemin:#eceef2; --kart:#fff; --yazi:#101418; --ikinci:#5d636c; --ucuncu:#9aa0a8; --cizgi:#dfe2e7;
  --dogru:#1d8a4e; --dogru-acik:#e4f4ea; --yanlis:#c8352b; --yanlis-acik:#fdeceb;
  --baslik:Overpass,system-ui,sans-serif; --govde:Atkinson,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#d9dce2;font-family:var(--govde);color:var(--yazi);-webkit-font-smoothing:antialiased;padding:28px;display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
.tel{width:390px;height:844px;border-radius:46px;background:var(--zemin);overflow:hidden;position:relative;box-shadow:0 0 0 10px #111,0 30px 60px -20px rgba(0,0,0,.45);flex:none;display:flex;flex-direction:column}
.durum{height:47px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 30px;font:600 15px/1 system-ui;color:#fff}
.kay{flex:1;overflow:hidden;position:relative}

/* ---------- ÖĞREN: üst ---------- */
.ust{background:var(--gece);color:#fff;padding:6px 20px 26px;position:relative}
.ust-sat{display:flex;align-items:center;justify-content:space-between}
.goz{font:700 12px/1 var(--baslik);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.gun{font:700 12px/1 var(--baslik);letter-spacing:.06em;color:var(--sari);display:flex;align-items:center;gap:6px}
.gun i{width:7px;height:7px;border-radius:50%;background:var(--sari)}
.ust h1{font:800 28px/1.05 var(--baslik);letter-spacing:-.02em;margin:12px 0 16px}
.devam{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;background:var(--gece-2);border-radius:22px;padding:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.kapak{width:96px;height:96px;border-radius:16px;background:#f4f1e8;display:grid;place-items:center}
.kapak svg{width:76px;height:76px}
.devam small{display:block;font:700 11px/1 var(--baslik);letter-spacing:.12em;text-transform:uppercase;color:var(--sari)}
.devam b{display:block;font:800 19px/1.15 var(--baslik);margin:7px 0 6px;letter-spacing:-.01em}
.devam span{font:600 13px/1.2 var(--baslik);color:rgba(255,255,255,.62)}
.parca{display:flex;gap:3px;margin-top:10px}.parca i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.16)}.parca i.d{background:var(--sari)}
.dg-sari{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;margin-top:14px;border-radius:16px;background:var(--sari);color:var(--gece);font:800 17px/1 var(--baslik);letter-spacing:-.01em}
.dg-sari svg{width:18px;height:18px}

/* ---------- ÖĞREN: yol ---------- */
.harita{position:relative;padding:22px 0 30px}
.yol{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.gantri{position:relative;margin:0 16px 22px 16px;border-radius:12px;padding:3px;background:var(--yesil-levha);box-shadow:0 10px 22px -14px rgba(0,0,0,.6)}
.gantri.mavi{background:var(--mavi)}
.gantri-ic{border:2px solid rgba(255,255,255,.92);border-radius:9px;padding:9px 12px 8px;color:#fff;display:flex;align-items:center;gap:10px}
.gantri-ic b{font:800 17px/1 var(--baslik);letter-spacing:.04em;text-transform:uppercase}
.gantri-ic span{margin-left:auto;font:700 13px/1 var(--baslik);opacity:.85}
.gantri-ic svg{width:16px;height:16px;flex:none}
.konu{position:relative;display:grid;grid-template-columns:88px 1fr;align-items:center;min-height:78px;padding-right:16px}
.isaret{justify-self:center;width:38px;height:38px;display:grid;place-items:center;position:relative;z-index:1}
.isaret.bitti{border-radius:50%;background:var(--mavi);box-shadow:0 0 0 3px #fff,0 3px 8px rgba(0,0,0,.35)}
.isaret.bitti svg{width:18px;height:18px}
.isaret.simdi{width:44px;height:44px}
.isaret.simdi::before{content:"";position:absolute;inset:3px;transform:rotate(45deg);background:var(--sari);border-radius:5px;box-shadow:0 0 0 3px #fff,0 4px 12px rgba(0,0,0,.4)}
.isaret.simdi b{position:relative;font:800 17px/1 var(--baslik);color:var(--gece)}
.isaret.simdi::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--sari);animation:nabiz 2.2s ease-out infinite}
@keyframes nabiz{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.isaret.sonra{border-radius:8px;background:#fff;box-shadow:0 0 0 2px #c9ced6;font:800 14px/1 var(--baslik);color:var(--ucuncu)}
.konu-ad b{display:block;font:700 16px/1.25 var(--baslik);letter-spacing:-.005em}
.konu-ad small{display:block;font:600 13px/1.2 var(--baslik);color:var(--ikinci);margin-top:3px}
.konu.gecmis .konu-ad b{color:var(--ikinci);font-weight:600}
.konu.gelecek .konu-ad b{color:var(--ucuncu);font-weight:600}
.konu.etkin .konu-ad{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 12px 24px -16px rgba(11,24,48,.45),0 0 0 1px rgba(11,24,48,.05)}
.konu.etkin .konu-ad small{color:var(--sari-koyu);font-weight:700}

.alt{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.94);border-top:1px solid var(--cizgi);padding:8px 0 26px}
.alt div{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px/1 system-ui;color:#8a9099}
.alt svg{width:24px;height:24px}
.alt .s{color:var(--gece)}

/* ---------- DERS: kart ---------- */
.ders{background:#fff}
.ders-ust{display:flex;align-items:center;gap:14px;padding:6px 20px 0}
.ders-ust svg{width:22px;height:22px;color:var(--ucuncu);flex:none}
.serit{flex:1;display:flex;gap:4px}.serit i{flex:1;height:5px;border-radius:3px;background:#e6e8ec}.serit i.d{background:var(--gece)}.serit i.s{background:var(--sari)}
.ders-govde{padding:22px 24px 0}
.sahne{height:236px;border-radius:24px;background:#f4f1e8;display:grid;place-items:center;position:relative;overflow:hidden}
.sahne svg.lv{width:150px;height:150px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.18))}
.sahne-not{position:absolute;left:14px;bottom:12px;font:700 11px/1 var(--baslik);letter-spacing:.1em;text-transform:uppercase;color:#8d8678}
.ders-goz{font:700 12px/1 var(--baslik);letter-spacing:.14em;text-transform:uppercase;color:var(--mavi);margin:26px 0 10px}
.ders h2{font:800 27px/1.1 var(--baslik);letter-spacing:-.02em;margin-bottom:14px}
.ders p.okur{font-size:18px;line-height:1.55;color:#262b31}
.ders p.okur em{font-style:normal;background:linear-gradient(transparent 60%,#ffe599 60%);font-weight:700}
.ders-alt{position:absolute;left:0;right:0;bottom:0;padding:14px 20px 34px;background:linear-gradient(rgba(255,255,255,0),#fff 28%)}
.dg-koyu{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:18px;background:var(--gece);color:#fff;font:800 18px/1 var(--baslik)}

/* ---------- DERS: soru ---------- */
.soru-goz{display:flex;align-items:center;gap:8px;font:700 12px/1 var(--baslik);letter-spacing:.14em;text-transform:uppercase;color:var(--sari-koyu);margin:30px 0 12px}
.soru-goz i{width:14px;height:14px;transform:rotate(45deg);background:var(--sari);border-radius:2px}
.soru-kok{font:700 23px/1.25 var(--baslik);letter-spacing:-.015em;margin-bottom:22px}
.sik{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:12px 16px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1.5px #dfe2e7;margin-bottom:10px;text-align:left;font-size:17px;line-height:1.3}
.sik kbd{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#f0f2f5;font:800 14px/1 var(--baslik);color:var(--ikinci)}
.sik.dogru{box-shadow:inset 0 0 0 2px var(--dogru);background:var(--dogru-acik);color:#0f5530}
.sik.dogru kbd{background:var(--dogru);color:#fff}
.sik.soluk{opacity:.45}
.geri{position:absolute;left:0;right:0;bottom:0;background:var(--dogru-acik);padding:20px 22px 34px;border-radius:26px 26px 0 0;box-shadow:0 -10px 30px -18px rgba(0,0,0,.3)}
.geri-bas{display:flex;align-items:center;gap:10px;font:800 21px/1 var(--baslik);color:#0f5530}
.geri-bas span{width:30px;height:30px;border-radius:50%;background:var(--dogru);display:grid;place-items:center}
.geri-bas svg{width:17px;height:17px}
.geri p{font-size:16px;line-height:1.5;color:#1b5a36;margin:12px 0 16px}
.geri .dg-koyu{background:var(--dogru)}
.etiket{font:700 13px/1 system-ui;color:#3d4148;text-align:center;margin-top:10px;width:390px}
</style></head><body>

<div><div class="tel" id="t1"></div><p class="etiket">Öğren · ana ekran</p></div>
<div><div class="tel" id="t2"></div><p class="etiket">Ders · okuma kartı</p></div>
<div><div class="tel" id="t3"></div><p class="etiket">Ders · kısa soru ve geri bildirim</p></div>

<script type="module">
import { LEVHA } from '../js/levha.js';
const ic = {
  tik:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  kapat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};
const durum = koyu => `<div class="durum" style="${koyu ? '' : 'color:#111'}"><span>09:41</span><span>●●● ▮</span></div>`;
const altCubuk = () => `<nav class="alt">${[
  ['Ana sayfa','<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>'],
  ['Derslerim','<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'],
  ['Öğren','<path d="M12 3l9 9-9 9-9-9z"/><path d="M12 8v5M12 16v.2"/>'],
  ['Ödeme','<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/>'],
  ['Belgeler','<path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/>']
].map(([t,p],i)=>`<div class="${i===2?'s':''}"><svg viewBox="0 0 24 24" fill="${i===2?'currentColor':'none'}" stroke="${i===2?'none':'currentColor'}" stroke-width="1.8" stroke-linejoin="round">${i===2?'<path d="M12 2.5l9.5 9.5-9.5 9.5L2.5 12z"/><path d="M12 7.5v6M12 16.2v.3" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>':p}</svg>${t}</div>`).join('')}</nav>`;

// ---------- 1: Öğren ----------
const konular = [
  ['Temel kavramlar','10/10 doğru'],['Trafik işaretleri','9/10 doğru'],['Yol çizgileri ve ışıklar','8/10 doğru'],
  ['Kavşaklar ve geçiş hakkı','Kaldığın yer · 3/12'],['Hız sınırları ve takip mesafesi','7 kart · 5 soru'],
  ['Sollama, şerit değiştirme, dönüşler','8 kart · 5 soru'],['Duraklama ve park etme','6 kart · 5 soru']];
const satir = (k,i) => { const d = i < 3 ? 'gecmis' : i === 3 ? 'etkin' : 'gelecek';
  const is = i < 3 ? `<span class="isaret bitti">${ic.tik}</span>` : i === 3 ? `<span class="isaret simdi"><b>4</b></span>` : `<span class="isaret sonra">${i+1}</span>`;
  return `<div class="konu ${d}">${is}<div class="konu-ad"><b>${k[0]}</b><small>${k[1]}</small></div></div>`; };
document.getElementById('t1').innerHTML = `<div style="background:var(--gece)">${durum(true)}</div><div class="kay">
  <section class="ust"><div class="ust-sat"><span class="goz">Öğren</span><span class="gun"><i></i>e-Sınav'a 23 gün</span></div>
    <h1>Günaydın, Berk</h1>
    <div class="devam"><span class="kapak">${LEVHA['T-21'].svg}</span><div><small>Kaldığın yer</small><b>Kavşaklar ve geçiş hakkı</b><span>12 adım · yaklaşık 6 dk</span><div class="parca">${Array.from({length:12},(_,i)=>`<i class="${i<3?'d':''}"></i>`).join('')}</div></div></div>
    <button class="dg-sari">Devam et ${ic.ok}</button></section>
  <section class="harita" id="harita">
    <div class="gantri"><div class="gantri-ic"><b>Trafik ve çevre</b><span>3 / 20</span>${ic.ok}</div></div>
    ${konular.map(satir).join('')}
  </section></div>${altCubuk()}`;

// asfalt yol: konu işaretlerinin altından kıvrılarak geçer
requestAnimationFrame(() => {
  const h = document.getElementById('harita'), H = h.offsetHeight, x0 = 44, Y0 = 56;
  const pts = []; for (let y = Y0; y <= H + 40; y += 6) pts.push([x0 + Math.sin((y - Y0) / 95) * 9, y]);
  const d = 'M' + pts.map(p => p.map(n => n.toFixed(1)).join(' ')).join(' L');
  h.insertAdjacentHTML('afterbegin', `<svg class="yol" viewBox="0 0 390 ${H}" preserveAspectRatio="none">
    <path d="${d}" stroke="#262a31" stroke-width="44" fill="none" stroke-linecap="round" opacity=".18" transform="translate(0 3)"/>
    <path d="${d}" stroke="var(--asfalt)" stroke-width="42" fill="none"/>
    <path d="${d}" stroke="rgba(255,255,255,.55)" stroke-width="36" fill="none" stroke-dasharray="0" style="mix-blend-mode:overlay"/>
    <path d="${d}" stroke="var(--asfalt-2)" stroke-width="34" fill="none"/>
    <path d="${d}" stroke="#fff" stroke-width="2.4" fill="none" stroke-dasharray="11 13" opacity=".9"/></svg>`);
});

// ---------- 2: okuma kartı ----------
const serit = (n, d, s) => `<div class="serit">${Array.from({length:n},(_,i)=>`<i class="${i<d?'d':i===d&&s?'s':''}"></i>`).join('')}</div>`;
document.getElementById('t2').innerHTML = `${durum(false)}<div class="kay ders">
  <div class="ders-ust">${ic.kapat}${serit(12,3,true)}</div>
  <div class="ders-govde">
    <div class="sahne"><svg class="lv" viewBox="0 0 120 120">${LEVHA['T-21'].svg.replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg><span class="sahne-not">T-21 · Kontrolsüz kavşak</span></div>
    <p class="ders-goz">4 / 12 · Geçiş hakkı</p>
    <h2>Işık, levha ya da görevli yoksa</h2>
    <p class="okur">Kavşak kolları işaretle belirlenmemişse <em>soldaki sürücü, sağdan gelen araca yol verir.</em> Motorsuz araç motorlu araca, traktör ve iş makinesi diğer motorlu araçlara yol verir.</p>
  </div>
  <div class="ders-alt"><button class="dg-koyu">Devam</button></div></div>`;

// ---------- 3: soru ----------
document.getElementById('t3').innerHTML = `${durum(false)}<div class="kay ders">
  <div class="ders-ust">${ic.kapat}${serit(12,7,true)}</div>
  <div class="ders-govde">
    <p class="soru-goz"><i></i>Kısa soru</p>
    <p class="soru-kok">Levha, ışık ve görevli olmayan bir kavşağa iki otomobil aynı anda geliyor. Geçiş hakkı hangisinindir?</p>
    <button class="sik soluk"><kbd>A</kbd>Soldan gelen otomobilin</button>
    <button class="sik dogru"><kbd>B</kbd>Sağdan gelen otomobilin</button>
    <button class="sik soluk"><kbd>C</kbd>Daha hızlı gelen otomobilin</button>
    <button class="sik soluk"><kbd>D</kbd>Kavşağa ilk giren otomobilin</button>
  </div>
  <div class="geri"><div class="geri-bas"><span>${ic.tik}</span>Doğru</div><p>Kol önceliği işaretlenmemişse soldaki sürücü, sağdan gelen araca yol verir.</p><button class="dg-koyu">Devam</button></div></div>`;
</script>
</body></html>
